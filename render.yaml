services:
  # Backend API Web Service
  - type: web
    name: arthayog-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./arthayog.db
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: BOOKING_HOLD_TIMEOUT_MINUTES
        value: 15
      - key: RAZORPAY_KEY_ID
        value: rzp_test_arthayog_sample_key
      - key: RAZORPAY_KEY_SECRET
        value: sample_razorpay_secret_key_12345
      - key: INITIAL_OWNER_EMAIL
        value: owner@arthayog.com
      - key: INITIAL_OWNER_PASSWORD
        value: AdminSecurePassword123!
      - key: INITIAL_STAFF_EMAIL
        value: staff@arthayog.com
      - key: INITIAL_STAFF_PASSWORD
        value: StaffSecurePassword123!

  # Frontend Static Site
  - type: web
    name: arthayog-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://arthayog-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

